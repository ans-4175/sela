name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: v0.0.0-ci
      source_tag:
        type: string
        default: ''
      expected_commit:
        type: string
        default: ''
    outputs:
      commit:
        value: ${{ jobs.package.outputs.commit }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || github.ref }}
      - if: inputs.expected_commit != ''
        name: Verify selected test source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race -timeout 120s ./...
      - if: runner.os == 'Windows'
        run: go test -timeout 120s ./...
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/smoke.py --build

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || github.ref }}
      - if: inputs.expected_commit != ''
        name: Verify selected package source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: identity
        name: Require clean source and bind tag identity
        shell: bash
        env:
          VERSION: ${{ inputs.version || 'v0.0.0-ci' }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [ -n "$SOURCE_TAG" ]; then
            test "$VERSION" = "$SOURCE_TAG"
            test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
            test "$(git rev-parse "refs/tags/$SOURCE_TAG^{commit}")" = "$EXPECTED_COMMIT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$VERSION" = "$GITHUB_REF_NAME"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$VERSION^{commit}")"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build all six archives and checksums
        env:
          VERSION: ${{ inputs.version || 'v0.0.0-ci' }}
        run: python scripts/build_release.py --version "$VERSION"
      - name: Smoke the packaged Linux binary and injected version
        env:
          VERSION: ${{ inputs.version || 'v0.0.0-ci' }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tarfile
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sela-package-smoke'
          path.mkdir()
          binary = path / 'sela'
          with tarfile.open(f"dist/sela_{os.environ['VERSION']}_linux_amd64.tar.gz") as archive:
              assert set(archive.getnames()) == {'sela', 'README.md', 'LICENSE'}
              binary.write_bytes(archive.extractfile('sela').read())
          binary.chmod(0o755)
          subprocess.run(['python', 'scripts/smoke.py', '--binary', str(binary), '--expected-version', os.environ['VERSION']], check=True)
          PY
      - if: github.ref_type == 'tag' || inputs.source_tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sela-release-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
