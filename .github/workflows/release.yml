name: GitHub prerelease

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to release; never creates or moves a tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      commit: ${{ steps.target.outputs.commit }}
    steps:
      - id: target
        name: Resolve immutable existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          assert len(tag) <= 128 and re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.+-]+)?', tag), 'invalid release tag'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + path], text=True))
          obj = api('/git/ref/tags/' + tag)['object']
          for _ in range(5):
              if obj['type'] == 'commit':
                  break
              assert obj['type'] == 'tag', 'tag must resolve to a commit'
              obj = api('/git/tags/' + obj['sha'])['object']
          assert obj['type'] == 'commit' and re.fullmatch(r'[a-f0-9]{40}', obj['sha']), 'invalid tagged commit'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\ncommit=' + obj['sha'] + '\n')
          PY

  checks:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.resolve.outputs.tag }}
      source_tag: ${{ needs.resolve.outputs.tag }}
      expected_commit: ${{ needs.resolve.outputs.commit }}

  publish:
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No source checkout or repository script execution in the write-permission job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sela-release-${{ github.run_id }}
          path: dist
      - name: Verify exact asset inventory, identity and checksums
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          tag, commit = os.environ['RELEASE_TAG'], os.environ['EXPECTED_COMMIT']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.+-]+)?', tag)
          assert re.fullmatch(r'[a-f0-9]{40}', commit)
          root = pathlib.Path('dist')
          archives = {f'sela_{tag}_{system}_{arch}' + ('.zip' if system == 'windows' else '.tar.gz')
                      for system in ('darwin', 'linux', 'windows') for arch in ('amd64', 'arm64')}
          expected = archives | {'MANIFEST.json', 'RELEASE_NOTES.md'}
          assert {p.name for p in root.iterdir()} == expected | {'SHA256SUMS.txt'}
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir())
          checksums = {}
          for line in (root / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert name in expected and name not in checksums
              assert digest == hashlib.sha256((root / name).read_bytes()).hexdigest()
              checksums[name] = digest
          assert set(checksums) == expected
          manifest = json.loads((root / 'MANIFEST.json').read_text())
          assert manifest['version'] == tag and manifest['commit'] == commit and manifest['modified'] is False
          assert len(manifest['artifacts']) == 6
          assert {a['file'] for a in manifest['artifacts']} == archives
          assert {(a['os'], a['arch']): a['file'] for a in manifest['artifacts']} == {
              (system, arch): f'sela_{tag}_{system}_{arch}' + ('.zip' if system == 'windows' else '.tar.gz')
              for system in ('darwin', 'linux', 'windows') for arch in ('amd64', 'arm64')}
          for asset in manifest['artifacts']:
              assert asset['sha256'] == checksums[asset['file']]
              if asset['os'] == 'windows':
                  assert asset['scope'] == 'experimental discovery-only; protected state disabled'
          PY
      - name: Publish on GitHub Releases only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + path], text=True))
          obj = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])['object']
          for _ in range(5):
              if obj['type'] == 'commit':
                  break
              assert obj['type'] == 'tag'
              obj = api('/git/tags/' + obj['sha'])['object']
          assert obj['type'] == 'commit' and obj['sha'] == os.environ['EXPECTED_COMMIT'], 'tag moved since CI; refusing publication'
          PY
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$EXPECTED_COMMIT" --prerelease --latest=false \
            --title "Sela $RELEASE_TAG (prerelease)" --notes-file dist/RELEASE_NOTES.md
